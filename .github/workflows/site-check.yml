name: Static Reader Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_site.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 scripts/knowledge_contract.py --check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/check_scout_routine_release.py --base '${{ github.event.pull_request.base.sha }}' --if-present
        if: github.event_name == 'pull_request'
      # Only the two owner-selected issue 45 cards may enter this release.
      # The normal PR and exact-head publication decisions remain separate.
      - run: python3 scripts/check_social.py --release
