name: Static Reader Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_site.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python3 scripts/knowledge_contract.py --check
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      # Draft preview cards pass technical checks, but the production gate
      # stays closed until Tony approves exact artwork under issue #45.
      - run: python3 scripts/check_social.py --release
