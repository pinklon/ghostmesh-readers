name: Reconcile SharePlane Public Search
on:
  repository_dispatch:
    types: [shareplane-public-work-published]
  workflow_dispatch:
  schedule:
    # A low-cost missed-event reconciliation, not a second publisher.
    - cron: '17 */12 * * *'
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check commissioned public refresh interface
        id: config
        env:
          CORPUS_URL: ${{ vars.SHAREPLANE_PUBLIC_CORPUS_URL }}
          BUILD_HOOK_URL: ${{ secrets.NETLIFY_READERS_BUILD_HOOK_URL }}
          REFRESH_ACTIVE: ${{ vars.SHAREPLANE_REFRESH_ACTIVE }}
        run: |
          if [ "$REFRESH_ACTIVE" != "true" ]; then
            echo "Public refresh not commissioned; no provider action."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$CORPUS_URL" ] || [ -z "$BUILD_HOOK_URL" ]; then
            echo "::error::Active refresh requires the canonical corpus URL and Netlify hook"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Verify source and compare deployed index
        if: steps.config.outputs.ready == 'true'
        id: compare
        env:
          CORPUS_URL: ${{ vars.SHAREPLANE_PUBLIC_CORPUS_URL }}
        run: |
          set +e
          python3 -m scripts.check_public_search_freshness --corpus-url "$CORPUS_URL"
          result=$?
          set -e
          if [ "$result" = 10 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [ "$result" = 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Public source verification failed; retain last-good deployment"
            exit 1
          fi
      - name: Request verified Netlify rebuild
        if: steps.compare.outputs.changed == 'true'
        env:
          BUILD_HOOK_URL: ${{ secrets.NETLIFY_READERS_BUILD_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --max-time 25 --request POST "$BUILD_HOOK_URL"
          echo "Build requested; Netlify must validate again before deployment."
