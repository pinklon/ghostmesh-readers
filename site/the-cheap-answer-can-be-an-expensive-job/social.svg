<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The Cheap Answer Can Be an Expensive Job</title>
  <desc id="desc">GhostMesh Reader 69. The acceptance boundary separates a candidate response from an accepted outcome.</desc>
  <rect width="1200" height="630" fill="#131619"/>
  <path d="M70 105h1060M70 534h1060" fill="none" stroke="#525a60"/>
  <text x="70" y="85" fill="#a8d3d3" font-family="monospace" font-size="23">GhostMesh Reader #69</text>
  <g fill="#f3eee4" font-family="Georgia, serif" font-size="84">
    <text x="67" y="235">The Cheap Answer</text>
    <text x="67" y="327">Can Be an Expensive Job</text>
  </g>
  <path d="M70 408h1060M600 408v126" fill="none" stroke="#ffc18e"/>
  <g font-family="sans-serif" font-size="30">
    <text x="70" y="482" fill="#f3eee4">Candidate response / API invoice</text>
    <text x="635" y="482" fill="#a8d3d3">Accepted outcome</text>
  </g>
  <text x="70" y="573" fill="#bdc4c7" font-family="monospace" font-size="22">Inference  /  Verification  /  Rework  /  Human attention</text>
